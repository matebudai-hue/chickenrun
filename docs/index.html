<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#152b34">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Chicken Run">
  <title>Chicken Run</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css?v=5">
  <script src="./qr.js" defer></script>
  <script src="./app.js?v=6" type="module"></script>
</head>
<body>
  <main id="app">
    <header class="mast">
      <a href="./" class="brand"><img src="./icon.svg" width="34" height="34" alt="">Chicken Run</a>
      <div id="connection" class="badge connection" role="status" data-state="idle"></div>
    </header>
    <div id="notice" class="notice" hidden>
      <p id="notice-text" role="alert"></p>
      <button type="button" id="retry" class="button small secondary" hidden>Újrapróbálom</button>
    </div>
    <section id="screen"></section>
  </main>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <noscript>A játékhoz engedélyezd a JavaScriptet a böngészőben.</noscript>
</body>
</html>
